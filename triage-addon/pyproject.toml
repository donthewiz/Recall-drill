# Tool configuration only; the add-on is not a pip package.
# Target is Anki 26.08.1's bundled Python (3.13.13).

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv", "dist", "user_files"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["__init__.py", "card_triage", "tests"]
extraPaths = ["tests", "tests/anki_io", "tests/ui"]
exclude = [".venv", "dist", "**/__pycache__"]
typeCheckingMode = "standard"
# The Qt-free layers are held to strict. ui/ stays at standard because PyQt6's stubs leave
# signals partially Unknown, which strict rejects on every connect. Tests poke at private
# parts and at Anki's backend on purpose.
strict = [
    "card_triage/__init__.py",
    "card_triage/config.py",
    "card_triage/bar.py",
    "card_triage/keys.py",
    "card_triage/marker.py",
    "card_triage/rules.py",
    "card_triage/anki_io",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
